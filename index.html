<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vazados da BANDA 🇲🇿</title>
    <link rel="stylesheet" href="index.css" />
    
    <!-- ============================================
         PROTECAO CONTRA INSPECAO
         ============================================ -->
    <script>
        // ============================================
        //  BLOQUEAR INSPECAO DA PAGINA
        // ============================================
        
        // 1. Bloquear teclas de atalho
        document.addEventListener('keydown', function(e) {
            // F12 - Abrir DevTools
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            
            // Ctrl+Shift+I - Inspecionar
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                e.preventDefault();
                return false;
            }
            
            // Ctrl+Shift+J - Console
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            
            // Ctrl+U - Ver codigo fonte
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
                e.preventDefault();
                return false;
            }
            
            // Ctrl+S - Salvar pagina
            if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
                e.preventDefault();
                return false;
            }
            
            // Ctrl+P - Imprimir
            if (e.ctrlKey && (e.key === 'P' || e.key === 'p')) {
                e.preventDefault();
                return false;
            }
            
            // Ctrl+C - Copiar (apenas em elementos nao permitidos)
            if (e.ctrlKey && (e.key === 'C' || e.key === 'c')) {
                // Permite copiar apenas de inputs e textareas
                const tag = document.activeElement.tagName;
                if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                    e.preventDefault();
                    return false;
                }
            }
        });
        
        // 2. Bloquear botao direito
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 3. Bloquear arrastar imagens/videos
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 4. Detectar quando a pagina perde o foco
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('Atencao: pagina nao esta visivel');
            }
        });
        
        // 5. Prevenir que extensoes injetem codigo
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1) {
                            if (node.tagName === 'IFRAME' || 
                                (node.tagName === 'SCRIPT' && node.src && 
                                 node.src.includes('chrome-extension'))) {
                                node.remove();
                            }
                        }
                    });
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
        
        // 6. Bloquear PrintScreen
        document.addEventListener('keyup', function(e) {
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText('');
                alert('Captura de tela bloqueada!');
                return false;
            }
        });
        
        console.log('Protecoes ativadas!');
        console.log('  F12 bloqueado');
        console.log('  Botao direito bloqueado');
        console.log('  Ctrl+U bloqueado');
        console.log('  Ctrl+S bloqueado');
        console.log('  PrintScreen bloqueado');
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="logo">Vazados da BANDA 🇲🇿</div>
        <nav>
            <button id="btnHome">Inicio</button>
            <button id="btnAdmin"></button>
            <button id="btnLogout" style="display: none;">Sair</button>
        </nav>
    </header>

    <main id="pageHome">
        <div id="loadingIndicator" style="text-align: center; padding: 60px 0; color: #888;">
            <h3>Carregando videos...</h3>
        </div>
        <section class="video-grid" id="videoGrid"></section>
    </main>

    <main id="pageLogin" style="display: none;">
        <div class="login-container">
            <div class="login-box">
                <h2>Area Restrita</h2>
                <p>Digite a senha de administrador</p>
                <form id="loginForm">
                    <input type="password" id="adminPassword" placeholder="Digite a senha..." />
                    <button type="submit" class="btn-primary">Entrar</button>
                    <button type="button" class="btn-secondary" id="btnCancelLogin">Voltar</button>
                </form>
            </div>
        </div>
    </main>

    <main id="pageUpload" style="display: none;">
        <h2>Publicar novo video</h2>
        <div id="uploadProgress" style="display: none;">
            <div style="display: flex; justify-content: space-between;">
                <span>Enviando...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div style="width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 10px;">
                <div id="progressBar" style="width: 0%; height: 100%; background: #ff0033;"></div>
            </div>
        </div>
        <form id="uploadForm">
            <div class="form-group">
                <label>Titulo do video *</label>
                <input type="text" id="videoTitle" required placeholder="Digite o titulo..." />
            </div>
            <div class="form-group">
                <label>Descricao</label>
                <textarea id="videoDesc" rows="4" placeholder="Descreva o video..."></textarea>
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="videoCategory">
                    <option value="Geral">Geral</option>
                    <option value="Educacao">Educacao</option>
                    <option value="Entretenimento">Entretenimento</option>
                    <option value="Musica">Musica</option>
                    <option value="Games">Games</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Vazados">Vazados</option>
                </select>
            </div>
            <div class="form-group">
                <label>Arquivo de video *</label>
                <input type="file" id="uploadFile" accept="video/*" required />
                <small>Formatos: MP4, WebM (max. 50MB)</small>
            </div>
            <button type="submit" class="btn-primary">Publicar video</button>
            <button type="button" class="btn-secondary" id="btnCancel">Cancelar</button>
        </form>
    </main>

    <main id="pagePlayer" style="display: none;">
        <div class="player-container">
            <video id="playerVideo" controls autoplay></video>
            <h2 id="playerTitle">Titulo do Video</h2>
            <p id="playerDesc">Descricao</p>
            <p id="playerCategory">Categoria: <span></span></p>
            
            <div class="player-actions">
                <button id="btnBack" class="btn-secondary">Voltar</button>
                <button id="btnDownload" class="btn-download" style="display: none;">Baixar</button>
                <button id="btnDelete" class="btn-delete" style="display: none;">Excluir</button>
            </div>

            <div class="comments-section">
                <h3>Comentarios</h3>
                
                <div class="comment-form">
                    <textarea id="commentInput" rows="3" placeholder="Digite seu comentario..."></textarea>
                    <div class="comment-options">
                        <label>
                            <input type="checkbox" id="commentAnonymous" />
                            Comentar anonimamente
                        </label>
                        <button id="btnSendComment" class="btn-primary-small">Enviar</button>
                    </div>
                </div>

                <div id="commentsList" class="comments-list">
                    <p style="color: #666; text-align: center;">Carregando comentarios...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    
    <!-- ============================================
         PROTECAO ADICIONAL (evita que abram DevTools)
         ============================================ -->
    <script>
        // Bloquear abertura do DevTools via console
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
        
        // Tentar fechar DevTools se aberto
        (function() {
            var devtools = /./;
            devtools.toString = function() {
                this.opened = true;
                window.location.href = 'about:blank';
            };
            console.log('%c', devtools);
        })();
        
        // Bloquear acesso a variaveis globais
        Object.defineProperty(window, 'console', {
            value: console,
            writable: false,
            configurable: false
        });
    </script>
</body>
</html>
